[project]
name = "pdf-chat-rag-backend"
version = "0.1.0"
description = "Chat with your PDFs: FastAPI backend with hybrid retrieval and Claude citations"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.40",
    "python-multipart>=0.0.20",
    "anthropic>=2.3,<3",
    "pymupdf>=2.0,<3",
    "sentence-transformers>=6.2,<7",
    "torch>=2.14",
    "chromadb>=1.5.9,<2",
    "rank-bm25>=0.2.2",
    "sqlalchemy>=2.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "tokenizers>=0.22",
    "numpy>=2",
    "huggingface-hub>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.11",
    "anyio>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts/.cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
