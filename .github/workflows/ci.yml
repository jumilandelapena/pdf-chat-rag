name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  backend:
    name: backend (ruff, pytest, evals smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      LLM_PROVIDER: mock
      EMBEDDINGS_PROVIDER: fake
      HF_HUB_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          working-directory: backend
          enable-cache: true
          version: "0.13.5"
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      - name: Evals smoke (mock provider, fake embedder)
        run: uv run evals/run.py --provider mock --embeddings fake --limit 3 --out /tmp/eval-smoke.md --json /tmp/eval-smoke.json

  frontend:
    name: frontend (typecheck, vitest, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e (docker compose, mock provider, Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start the stack (mock provider; the embedder is baked into the image)
        run: docker compose up -d --build --wait --wait-timeout 300
        env:
          LLM_PROVIDER: mock
      - run: curl -fsS http://localhost:8080/api/health && curl -fsS -o /dev/null http://localhost:8080/docs
      - run: npx playwright test
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
          CI: "true"
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color --timestamps > compose-logs.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-failure
          path: |
            frontend/test-results/
            compose-logs.txt
          retention-days: 14
          if-no-files-found: ignore
      - if: always()
        run: docker compose down -v
