upstream api {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # never compress PDFs or the SSE stream
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx's default mime.types has no entry for ES modules; without a JavaScript type
    # Chromium refuses to start the pdf.js module worker and no PDF ever renders.
    location ~* .mjs$ {
        types { }
        default_type text/javascript;
        try_files $uri =404;
    }

    location /api/ {
        client_max_body_size 256m;   # 5 files x (50 MiB + multipart overhead); the app enforces 50 MiB per file
        error_page 413 = @too_large;
        proxy_pass http://api/;      # trailing slash strips /api: /api/chats -> /chats
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location @too_large {
        default_type application/json;
        return 413 '{"detail":"Upload too large: at most 5 files of 50 MiB each per request."}';
    }

    location = /docs {
        proxy_pass http://api/docs;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://api/openapi.json;
        proxy_set_header Host $host;
    }
}
